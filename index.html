<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Emoji Faces</title>
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <div id="start-screen" class="screen">
    <h1>Emoji Faces 🎭</h1>
    <p>Copy the emoji's face with your own face! Great for two players — get your faces in frame together.</p>
    <button id="start-btn">Start Camera &amp; Play</button>
    <p id="start-error" class="error" hidden></p>
  </div>

  <div id="game-screen" class="screen" hidden>
    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="round">Round <span id="round">1</span></div>
    </div>

    <div class="target-wrap">
      <div class="label">Make this face:</div>
      <div id="target-emoji" class="target-emoji">😊</div>
    </div>

    <div class="controls">
      <button id="help-btn" class="control-btn" type="button">🍪 Help</button>
      <button id="skip-btn" class="control-btn" type="button">⏭ Skip</button>
    </div>

    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <svg id="face-guide" class="face-guide" viewBox="0 0 200 200" hidden>
        <circle cx="100" cy="100" r="96" fill="#14151f" stroke="#ffb800" stroke-width="6" />
        <g id="face-guide-features" fill="none" stroke="#ffb800" stroke-width="10" stroke-linecap="round"></g>
      </svg>
      <div id="match-banner" class="match-banner" hidden>Nice! 🎉</div>
    </div>

    <div id="status" class="status">Loading face detector…</div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
