<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Emoji Faces</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <div id="start-screen" class="screen">
    <div class="lang-toggle">
      <button id="lang-en" class="lang-btn" type="button">EN</button>
      <button id="lang-he" class="lang-btn" type="button">עברית</button>
    </div>
    <h1 id="app-title">Emoji Faces 🎭</h1>
    <p id="app-subtitle">Copy the emoji's face with your own face! Great for two players — get your faces in frame together.</p>
    <button id="start-btn">Start Camera &amp; Play</button>
    <p id="start-error" class="error" hidden></p>
    <p class="build-version">Build v8</p>
  </div>

  <div id="game-screen" class="screen" hidden>
    <div class="hud">
      <div class="score"><span id="score-label">Score:</span> <span id="score">0</span></div>
      <div class="round"><span id="round-label">Round</span> <span id="round">1</span></div>
    </div>

    <div class="target-wrap">
      <div class="label" id="make-face-label">Make this face:</div>
      <div id="target-emoji" class="target-emoji">😊</div>
    </div>

    <div class="controls">
      <button id="help-btn" class="control-btn" type="button">🍪 Help</button>
      <button id="skip-btn" class="control-btn" type="button">⏭ Skip</button>
    </div>

    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="match-banner" class="match-banner" hidden>Nice! 🎉</div>
    </div>

    <div id="status" class="status">Loading face detector…</div>
  </div>

  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
